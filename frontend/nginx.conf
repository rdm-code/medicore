server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- SPA fallback ----
    # Any path that isn't a real file → index.html, so React Router handles it
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Long cache for hashed assets ----
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Proxy API to the backend ----
    # NOTE: no CORS needed anymore — browser hits same-origin /api/*
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # ---- Logout endpoint lives at /logout (Spring default) ----
    location = /logout {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host   $host;
        proxy_set_header   Cookie $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # ---- Security headers ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}