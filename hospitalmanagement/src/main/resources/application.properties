# Enable or disable automatic restarts (default is true)
spring.devtools.restart.enabled=true

# Exclude specific static paths or resources from triggering a restart
spring.devtools.restart.exclude=static/**,public/**

# Enable or disable the embedded LiveReload server (refreshes browser on change)
spring.devtools.livereload.enabled=true