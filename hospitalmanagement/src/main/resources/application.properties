# Enable or disable automatic restarts (default is true)
spring.devtools.restart.enabled=true

# Exclude specific static paths or resources from triggering a restart
spring.devtools.restart.exclude=static/**,public/**

# Enable or disable the embedded LiveReload server (refreshes browser on change)
spring.devtools.livereload.enabled=true

# First admin, created only if no ADMIN exists (see AdminSeeder). Override in real deployments.
app.admin.email=${ADMIN_EMAIL:admin@medicore.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
